%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/microchip/microchip,microchip,mpfs-sysreg-scb.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Microchip PolarFire SoC Microprocessor Subsystem (MSS) sysreg-scb register region

maintainers:
  - Conor Dooley <conor.dooley@microchip.com>

description:
  An wide assortment of registers, containing controls for core
  peripheral clocks and boot-time configuration knobs access mainly by
  platform firmware.

properties:
  compatible:
    oneOf:
      - items:
          - const: microchip,mpfs-sysreg-scb
          - const: syscon
      - items:
          - const: microchip,pic64gx-sysreg-scb
          - const: microchip,mpfs-sysreg-scb
          - const: syscon

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    syscon@20003000 {
      compatible = "microchip,mpfs-sysreg-scb", "syscon";
      reg = <0x0 0x20003000 0x0 0x1000>;
    };
...

