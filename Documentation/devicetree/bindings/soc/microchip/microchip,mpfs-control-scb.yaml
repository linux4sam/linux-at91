%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/microchip/microchip,microchip,mpfs-control-scb.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Microchip PolarFire SoC Microprocessor Subsystem (MSS) control-scb register region

maintainers:
  - Conor Dooley <conor.dooley@microchip.com>

description:
  An assortment of registers that controls the temperature sensor and
  access to the system services from the MSS.

properties:
  compatible:
    oneOf:
      - items:
          - const: microchip,mpfs-control-scb
          - const: syscon
      - items:
          - const: microchip,pic64gx-control-scb
          - const: microchip,mpfs-control-scb
          - const: syscon

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    syscon@37020000 {
      compatible = "microchip,mpfs-control-scb", "syscon";
      reg = <0x0 0x37020000 0x0 0x100>;
    };

...

