%YAML 1.2
---
$id: http://devicetree.org/schemas/media/microchip,bayer-interpolation-rtl-v4.8.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Microchip bayer interpolation

maintainers:
  - Shravan Chippa <shravan.chippa@microchip.com>

description: |
  The Microchip video bayer interpolation IP is used to convert the video from
  bayer to RGB video and stream the video data through AXI streaming
  interface or native interface for the image processing.

properties:
  compatible:
    oneOf:
      - items:
          - const: microchip,pic64gx-bayer-interpolation
          - const: microchip,bayer-interpolation-rtl-v4.8
      - const: microchip,bayer-interpolation-rtl-v4.8

  reg:
    maxItems: 1

  ports:
    $ref: /schemas/graph.yaml#/properties/ports

    properties:
      "#address-cells":
        const: 1

      "#size-cells":
        const: 0

      port@0:
        type: object
        description: The Input/sink port node properties.
        properties:
          reg:
            description: Input/sink port number.
            const: 0

          endpoint:
            type: object

            properties:
              remote-endpoint: true

            required:
              - remote-endpoint

            additionalProperties: false

        required:
          - reg
          - endpoint

        additionalProperties: false

    patternProperties:
      "port@1":
        type: object
        description: The Output/source port node properties.
        properties:
          reg:
            description: Output/source port number.

          endpoint:
            type: object

            properties:
              remote-endpoint: true

            required:
              - remote-endpoint

            additionalProperties: false

        required:
          - reg
          - endpoint

        additionalProperties: false

    required:
      - "#address-cells"
      - "#size-cells"
      - port@0
      - port@1

    additionalProperties: false

required:
  - compatible
  - reg
  - ports

additionalProperties: false

examples:
  - |
    demosaic-0@50020000 {
        compatible = "microchip,bayer-interpolation-rtl-v4.8";
        reg = <0x60080000 0x10000>;

        ports {
            #address-cells = <1>;
            #size-cells = <0>;

            port@0 {
                /* Sink port */
                reg = <0>;
                demosaic_0_in: endpoint {
                    remote-endpoint = <&mipi_csi2_0_in>;
                };
            };
            port@1 {
                /* Source port */
                reg = <1>;
                demosaic_0_out: endpoint {
                    remote-endpoint = <&image_enhancement_0_out>;
                };
            };
        };
    };
...
